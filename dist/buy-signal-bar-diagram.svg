<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520" role="img">
<title>Al Brooks Buy Signal Bar — anatomy diagram</title>
<desc>A labeled candlestick showing the anatomy of a strong buy signal bar: upper tail must be under 20% of range, bull body must be over 50% of range.</desc>
<defs>
  <style>
    text { font-family: -apple-system, 'Segoe UI', sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
  </style>
</defs>

<!-- Subtle grid -->
<line x1="40" y1="60" x2="640" y2="60" stroke="#e0ddd8" stroke-width="0.5" stroke-dasharray="4 4"/>
<line x1="40" y1="460" x2="640" y2="460" stroke="#e0ddd8" stroke-width="0.5" stroke-dasharray="4 4"/>

<!-- Wick -->
<line x1="310" y1="60" x2="310" y2="130" stroke="#2D3748" stroke-width="2.5" stroke-linecap="round"/>
<line x1="310" y1="370" x2="310" y2="460" stroke="#2D3748" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="310" cy="60" r="3" fill="#718096" opacity="0.6"/>
<circle cx="310" cy="460" r="3" fill="#718096" opacity="0.6"/>

<!-- Body -->
<rect x="250" y="130" width="120" height="240" rx="4" fill="#276749" opacity="0.9"/>
<rect x="250" y="130" width="120" height="240" rx="4" fill="none" stroke="#1C4532" stroke-width="1.5"/>
<text x="310" y="242" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#C6F6D5">Bull body</text>
<text x="310" y="262" text-anchor="middle" dominant-baseline="central" class="mono" font-size="10" fill="#9AE6B4">(Close − Open)</text>

<!-- OHLC labels -->
<text x="226" y="64" text-anchor="end" dominant-baseline="central" class="mono" font-size="11" fill="#718096">HIGH</text>
<line x1="230" y1="64" x2="249" y2="64" stroke="#CBD5E0" stroke-width="0.5"/>
<text x="226" y="134" text-anchor="end" dominant-baseline="central" class="mono" font-size="11" fill="#718096">CLOSE</text>
<line x1="230" y1="134" x2="249" y2="134" stroke="#CBD5E0" stroke-width="0.5"/>
<text x="226" y="366" text-anchor="end" dominant-baseline="central" class="mono" font-size="11" fill="#718096">OPEN</text>
<line x1="230" y1="366" x2="249" y2="366" stroke="#CBD5E0" stroke-width="0.5"/>
<text x="226" y="456" text-anchor="end" dominant-baseline="central" class="mono" font-size="11" fill="#718096">LOW</text>
<line x1="230" y1="456" x2="249" y2="456" stroke="#CBD5E0" stroke-width="0.5"/>

<!-- Upper tail brace -->
<line x1="372" y1="60" x2="418" y2="60" stroke="#E2E8F0" stroke-width="0.5"/>
<line x1="372" y1="130" x2="418" y2="130" stroke="#E2E8F0" stroke-width="0.5"/>
<line x1="414" y1="60" x2="414" y2="130" stroke="#A0AEC0" stroke-width="0.8"/>
<line x1="410" y1="60" x2="414" y2="60" stroke="#A0AEC0" stroke-width="0.8"/>
<line x1="410" y1="130" x2="414" y2="130" stroke="#A0AEC0" stroke-width="0.8"/>

<!-- Upper tail box -->
<rect x="426" y="68" width="198" height="52" rx="6" fill="#FFF5F5" stroke="#FC8181" stroke-width="1" opacity="0.95"/>
<text x="438" y="86" dominant-baseline="central" font-size="12" font-weight="600" fill="#C53030">Upper tail ≤ 20% of range</text>
<text x="438" y="106" dominant-baseline="central" class="mono" font-size="10" fill="#E53E3E">Condition 2: (High − Close) / Range</text>

<!-- Body brace -->
<line x1="372" y1="130" x2="468" y2="130" stroke="#E2E8F0" stroke-width="0.5"/>
<line x1="372" y1="370" x2="468" y2="370" stroke="#E2E8F0" stroke-width="0.5"/>
<line x1="464" y1="130" x2="464" y2="370" stroke="#A0AEC0" stroke-width="0.8"/>
<line x1="460" y1="130" x2="464" y2="130" stroke="#A0AEC0" stroke-width="0.8"/>
<line x1="460" y1="370" x2="464" y2="370" stroke="#A0AEC0" stroke-width="0.8"/>

<!-- Body box -->
<rect x="476" y="218" width="182" height="52" rx="6" fill="#F0FFF4" stroke="#68D391" stroke-width="1" opacity="0.95"/>
<text x="488" y="236" dominant-baseline="central" font-size="12" font-weight="600" fill="#276749">Body ≥ 50% of range</text>
<text x="488" y="256" dominant-baseline="central" class="mono" font-size="10" fill="#38A169">Condition 1: (Close − Open) / Range</text>

<!-- Lower tail brace -->
<line x1="372" y1="370" x2="418" y2="370" stroke="#E2E8F0" stroke-width="0.5"/>
<line x1="372" y1="460" x2="418" y2="460" stroke="#E2E8F0" stroke-width="0.5"/>
<line x1="414" y1="370" x2="414" y2="460" stroke="#A0AEC0" stroke-width="0.8"/>
<line x1="410" y1="370" x2="414" y2="370" stroke="#A0AEC0" stroke-width="0.8"/>
<line x1="410" y1="460" x2="414" y2="460" stroke="#A0AEC0" stroke-width="0.8"/>

<!-- Lower tail box -->
<rect x="426" y="390" width="148" height="42" rx="6" fill="#F7FAFC" stroke="#CBD5E0" stroke-width="1"/>
<text x="438" y="406" dominant-baseline="central" font-size="12" fill="#4A5568">Lower tail (no limit)</text>
<text x="438" y="422" dominant-baseline="central" class="mono" font-size="10" fill="#718096">(Open − Low) / Range</text>

<!-- Total range brace far left -->
<line x1="58" y1="60" x2="106" y2="60" stroke="#E2E8F0" stroke-width="0.5"/>
<line x1="58" y1="460" x2="106" y2="460" stroke="#E2E8F0" stroke-width="0.5"/>
<line x1="62" y1="60" x2="62" y2="460" stroke="#A0AEC0" stroke-width="0.8"/>
<line x1="62" y1="60" x2="66" y2="60" stroke="#A0AEC0" stroke-width="0.8"/>
<line x1="62" y1="460" x2="66" y2="460" stroke="#A0AEC0" stroke-width="0.8"/>
<text x="78" y="260" text-anchor="middle" dominant-baseline="central" class="mono" font-size="10" fill="#718096" transform="rotate(-90 78 260)">Total range = High − Low</text>

<!-- Caption -->
<text x="310" y="498" text-anchor="middle" font-size="12" fill="#A0AEC0">Strong buy signal bar — close near high, large bull body, minimal upper tail</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520">
<defs>
  <style>
    text { font-family: -apple-system, 'Segoe UI', sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
  </style>
</defs>

<!-- Background -->
<rect width="800" height="520" fill="#FAF8F5"/>

<!-- Section label -->
<text class="mono" x="400" y="30" text-anchor="middle" font-size="11" fill="#8A8480" letter-spacing="0.12em">BAR TYPE ANATOMY — AL BROOKS</text>

<!-- ═══ BULL TREND BAR ═══ -->
<text x="160" y="62" text-anchor="middle" font-size="14" font-weight="600" fill="#1A1814">Bull trend bar</text>
<text class="mono" x="160" y="79" text-anchor="middle" font-size="10" fill="#8A8480">body &gt; 60% of range</text>

<line x1="160" y1="95" x2="160" y2="122" stroke="#2D2D2D" stroke-width="2.5" stroke-linecap="round"/>
<rect x="128" y="122" width="64" height="210" rx="4" fill="#276749" opacity="0.88"/>
<rect x="128" y="122" width="64" height="210" rx="4" fill="none" stroke="#1C4532" stroke-width="1.5"/>
<line x1="160" y1="332" x2="160" y2="360" stroke="#2D2D2D" stroke-width="2.5" stroke-linecap="round"/>

<text class="mono" x="82" y="130" text-anchor="middle" font-size="10" fill="#8A8480">CLOSE</text>
<line x1="82" y1="134" x2="127" y2="126" stroke="#CBD5E0" stroke-width="0.5"/>
<text class="mono" x="82" y="345" text-anchor="middle" font-size="10" fill="#8A8480">OPEN</text>
<line x1="82" y1="340" x2="127" y2="332" stroke="#CBD5E0" stroke-width="0.5"/>

<line x1="194" y1="95" x2="238" y2="95" stroke="#E2E8F0" stroke-width="0.5"/>
<line x1="194" y1="122" x2="238" y2="122" stroke="#E2E8F0" stroke-width="0.5"/>
<line x1="234" y1="95" x2="234" y2="122" stroke="#A0AEC0" stroke-width="0.8"/>
<line x1="230" y1="95" x2="234" y2="95" stroke="#A0AEC0" stroke-width="0.8"/>
<line x1="230" y1="122" x2="234" y2="122" stroke="#A0AEC0" stroke-width="0.8"/>
<rect x="242" y="95" width="124" height="30" rx="5" fill="#F0FFF4" stroke="#68D391" stroke-width="1"/>
<text x="254" y="107" font-size="11" font-weight="600" fill="#276749">Small upper tail</text>
<text class="mono" x="254" y="120" font-size="10" fill="#38A169">≤ 20% of range ✓</text>

<line x1="194" y1="122" x2="278" y2="122" stroke="#E2E8F0" stroke-width="0.5"/>
<line x1="194" y1="332" x2="278" y2="332" stroke="#E2E8F0" stroke-width="0.5"/>
<line x1="274" y1="122" x2="274" y2="332" stroke="#A0AEC0" stroke-width="0.8"/>
<line x1="270" y1="122" x2="274" y2="122" stroke="#A0AEC0" stroke-width="0.8"/>
<line x1="270" y1="332" x2="274" y2="332" stroke="#A0AEC0" stroke-width="0.8"/>
<rect x="282" y="210" width="122" height="30" rx="5" fill="#F0FFF4" stroke="#68D391" stroke-width="1"/>
<text x="294" y="222" font-size="11" font-weight="600" fill="#276749">Large bull body</text>
<text class="mono" x="294" y="235" font-size="10" fill="#38A169">≥ 60% of range ✓</text>

<!-- ═══ TRADING RANGE BAR ═══ -->
<text x="460" y="62" text-anchor="middle" font-size="14" font-weight="600" fill="#1A1814">Trading range bar</text>
<text class="mono" x="460" y="79" text-anchor="middle" font-size="10" fill="#8A8480">body &lt; 30% of range</text>

<line x1="460" y1="95" x2="460" y2="192" stroke="#2D2D2D" stroke-width="2.5" stroke-linecap="round"/>
<rect x="434" y="192" width="52" height="64" rx="4" fill="#888" opacity="0.35"/>
<rect x="434" y="192" width="52" height="64" rx="4" fill="none" stroke="#A0AEC0" stroke-width="1.5"/>
<line x1="460" y1="256" x2="460" y2="360" stroke="#2D2D2D" stroke-width="2.5" stroke-linecap="round"/>

<line x1="488" y1="95" x2="540" y2="95" stroke="#E2E8F0" stroke-width="0.5"/>
<line x1="488" y1="192" x2="540" y2="192" stroke="#E2E8F0" stroke-width="0.5"/>
<line x1="536" y1="95" x2="536" y2="192" stroke="#A0AEC0" stroke-width="0.8"/>
<line x1="532" y1="95" x2="536" y2="95" stroke="#A0AEC0" stroke-width="0.8"/>
<line x1="532" y1="192" x2="536" y2="192" stroke="#A0AEC0" stroke-width="0.8"/>
<rect x="544" y="124" width="126" height="30" rx="5" fill="#FFF5F5" stroke="#FC8181" stroke-width="1"/>
<text x="556" y="136" font-size="11" font-weight="600" fill="#C53030">Large upper tail</text>
<text class="mono" x="556" y="149" font-size="10" fill="#E53E3E">sellers pushed back</text>

<rect x="544" y="210" width="118" height="30" rx="5" fill="#F7FAFC" stroke="#CBD5E0" stroke-width="1"/>
<text x="556" y="222" font-size="11" font-weight="600" fill="#4A5568">Small body</text>
<text class="mono" x="556" y="235" font-size="10" fill="#718096">no clear winner</text>

<line x1="488" y1="256" x2="540" y2="256" stroke="#E2E8F0" stroke-width="0.5"/>
<line x1="488" y1="360" x2="540" y2="360" stroke="#E2E8F0" stroke-width="0.5"/>
<line x1="536" y1="256" x2="536" y2="360" stroke="#A0AEC0" stroke-width="0.8"/>
<line x1="532" y1="256" x2="536" y2="256" stroke="#A0AEC0" stroke-width="0.8"/>
<line x1="532" y1="360" x2="536" y2="360" stroke="#A0AEC0" stroke-width="0.8"/>
<rect x="544" y="295" width="126" height="30" rx="5" fill="#FFF5F5" stroke="#FC8181" stroke-width="1"/>
<text x="556" y="307" font-size="11" font-weight="600" fill="#C53030">Large lower tail</text>
<text class="mono" x="556" y="320" font-size="10" fill="#E53E3E">buyers pushed back</text>

<!-- ═══ BEAR TREND BAR ═══ -->
<text x="700" y="62" text-anchor="middle" font-size="14" font-weight="600" fill="#1A1814">Bear trend bar</text>
<text class="mono" x="700" y="79" text-anchor="middle" font-size="10" fill="#8A8480">body &gt; 60% of range</text>

<line x1="700" y1="95" x2="700" y2="120" stroke="#2D2D2D" stroke-width="2.5" stroke-linecap="round"/>
<rect x="668" y="120" width="64" height="218" rx="4" fill="#9B2335" opacity="0.85"/>
<rect x="668" y="120" width="64" height="218" rx="4" fill="none" stroke="#7B1225" stroke-width="1.5"/>
<line x1="700" y1="338" x2="700" y2="360" stroke="#2D2D2D" stroke-width="2.5" stroke-linecap="round"/>

<text class="mono" x="700" y="236" text-anchor="middle" font-size="12" font-weight="600" fill="#FECDD3">Bear body</text>
<text class="mono" x="700" y="253" text-anchor="middle" font-size="10" fill="#FDA4AF">sellers in control</text>
<text class="mono" x="735" y="128" font-size="10" fill="#8A8480">OPEN</text>
<text class="mono" x="735" y="346" font-size="10" fill="#8A8480">CLOSE</text>

<!-- Caption -->
<line x1="40" y1="400" x2="760" y2="400" stroke="#E2E8F0" stroke-width="0.5"/>
<text x="400" y="425" text-anchor="middle" font-size="12" fill="#8A8480">Trend bars show conviction — one side dominated. Trading range bars show indecision — both sides pushed back.</text>
<text x="400" y="447" text-anchor="middle" font-size="12" fill="#8A8480">Context matters most — the same bar can mean different things depending on where it appears on the chart.</text>
</svg>
